<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 한 마디</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f7f6f2;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans KR',sans-serif;padding:2rem 1rem}
#app{width:100%;max-width:560px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.8rem}
.top-label{font-size:11px;font-weight:500;color:#999;letter-spacing:.14em}
.prog-wrap{display:flex;align-items:center;gap:8px}
.prog-bar{width:72px;height:2px;background:#ddd;border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:#888;transition:width .5s ease}
.prog-txt{font-size:11px;color:#aaa}
.card{background:#fff;border:1px solid #eee;border-radius:22px;padding:2.4rem 2rem 2rem;position:relative;overflow:hidden;min-height:290px;display:flex;flex-direction:column;box-shadow:0 2px 20px rgba(0,0,0,.06);transition:transform .35s ease,opacity .35s ease}
.card.out-left{transform:translateX(-50px);opacity:0}
.card.out-right{transform:translateX(50px);opacity:0}
.card.visible{transform:translateX(0);opacity:1}
.deco1{position:absolute;top:-55px;right:-55px;width:180px;height:180px;border-radius:50%;background:#f7f6f2;pointer-events:none}
.deco2{position:absolute;bottom:-38px;left:-38px;width:120px;height:120px;border-radius:50%;background:#f0efe9;pointer-events:none}
.day-num{font-size:11px;font-weight:500;color:#bbb;letter-spacing:.12em;margin-bottom:1.3rem;position:relative;z-index:1}
.qmark{font-size:44px;line-height:1;color:#ddd;font-family:Georgia,serif;margin-bottom:.4rem;display:block;position:relative;z-index:1}
.card-title{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:700;color:#222;line-height:1.45;margin-bottom:1.3rem;position:relative;z-index:1}
.card-body{font-size:14px;color:#666;line-height:1.9;font-weight:300;position:relative;z-index:1;flex:1}
.card-footer{display:flex;justify-content:flex-end;margin-top:1.6rem;position:relative;z-index:1}
.heart-btn{background:none;border:1px solid #e0e0e0;border-radius:99px;padding:6px 16px;cursor:pointer;font-size:12px;color:#888;display:flex;align-items:center;gap:6px;transition:all .2s;font-family:'Noto Sans KR',sans-serif}
.heart-btn:hover{background:#fafafa}
.heart-btn.liked{border-color:#c0392b;color:#c0392b}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:1.3rem}
.nav-btn{background:none;border:1px solid #e0e0e0;border-radius:99px;padding:8px 20px;cursor:pointer;font-size:12px;color:#666;font-family:'Noto Sans KR',sans-serif;transition:all .2s;display:flex;align-items:center;gap:5px}
.nav-btn:hover{background:#f5f5f5}
.nav-btn:disabled{opacity:.25;cursor:default;pointer-events:none}
.today-btn{font-size:11px;font-weight:500;color:#aaa;padding:6px 16px;border-radius:99px;border:1px solid #e8e8e8;cursor:pointer;background:none;font-family:'Noto Sans KR',sans-serif;transition:all .2s}
.today-btn:hover{background:#f5f5f5}
.date-row{text-align:center;font-size:11px;color:#bbb;margin-top:1rem}
.dot-row{display:flex;justify-content:center;gap:3px;margin-top:1rem;flex-wrap:wrap;max-width:340px;margin-left:auto;margin-right:auto}
.dot{width:5px;height:5px;border-radius:50%;background:#ddd;cursor:pointer;transition:all .2s}
.dot.past{background:#aaa}
.dot.now{background:#333;transform:scale(1.5)}
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <span class="top-label">오늘의 한 마디</span>
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" id="pbar"></div></div>
      <span class="prog-txt" id="ptxt"></span>
    </div>
  </div>
  <div class="card visible" id="card">
    <div class="deco1"></div><div class="deco2"></div>
    <div class="day-num" id="dayNum"></div>
    <span class="qmark">"</span>
    <div class="card-title" id="cardTitle"></div>
    <div class="card-body" id="cardBody"></div>
    <div class="card-footer">
      <button class="heart-btn" id="heartBtn" onclick="toggleHeart()">♡ <span id="heartTxt">마음에 담기</span></button>
    </div>
  </div>
  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">← 이전</button>
    <button class="today-btn" onclick="goToday()">오늘로</button>
    <button class="nav-btn" id="nextBtn" onclick="go(1)">다음 →</button>
  </div>
  <div class="date-row" id="dateRow"></div>
  <div class="dot-row" id="dotRow"></div>
</div>

const START=new Date('2025-01-01');
const liked=JSON.parse(localStorage.getItem('wc_liked')||'[]');
let cur=0;

function todayIdx(){
  const d=Math.floor((new Date()-START)/864e5);
  return Math.min(Math.max(d%100,0),99);
}

function render(dir){
  const card=document.getElementById('card');
  const cls=dir===-1?'out-right':dir===1?'out-left':null;
  if(cls){
    card.classList.remove('visible');
    card.classList.add(cls);
    setTimeout(()=>{
      card.classList.remove(cls);
      card.style.opacity='0';
      fill();
      requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add('visible')));
    },300);
  } else fill();
}

function fill(){
  const[title,body]=DATA[cur];
  document.getElementById('dayNum').textContent=`DAY ${cur+1}`;
  document.getElementById('cardTitle').textContent=title;
  document.getElementById('cardBody').textContent=body;
  document.getElementById('pbar').style.width=(cur+1)+'%';
  document.getElementById('ptxt').textContent=`${cur+1}/100`;
  const lk=liked.includes(cur);
  document.getElementById('heartBtn').className='heart-btn'+(lk?' liked':'');
  document.getElementById('heartTxt').textContent=lk?'담았어요':'마음에 담기';
  document.getElementById('prevBtn').disabled=cur===0;
  document.getElementById('nextBtn').disabled=cur===99;
  const n=new Date();
  document.getElementById('dateRow').textContent=`${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일`;
  buildDots();
}

function buildDots(){
  const row=document.getElementById('dotRow');
  row.innerHTML='';
  for(let i=0;i<100;i++){
    const d=document.createElement('div');
    d.className='dot'+(i<cur?' past':i===cur?' now':'');
    d.title=`${i+1}일차`;
    d.onclick=(idx=>()=>jump(idx))(i);
    row.appendChild(d);
  }
}

function go(dir){const n=cur+dir;if(n<0||n>99)return;cur=n;render(dir)}
function jump(idx){if(idx===cur)return;const dir=idx>cur?1:-1;cur=idx;render(dir)}
function goToday(){const t=todayIdx();if(t===cur)return;jump(t)}
function toggleHeart(){
  const i=liked.indexOf(cur);
  if(i>-1)liked.splice(i,1);else liked.push(cur);
  localStorage.setItem('wc_liked',JSON.stringify(liked));
  fill();
}

cur=todayIdx();
render(0);
</script>
</body>
</html>
